<meta name=viewport content="width=device-width, initial-scale=1">
<title>Pomodoro</title>
<template id=tmp>
    <div class=k>
        <p class=ht></p>
        <input class=d placeholder="What are you working on?">
    </div>
</template>
<button id=t-h>?</button>
<div id=m>
    <div id=c-ctnr>
        <input id=c value="30:00" placeholder="MM:SS">
        <button id=o>START</button>
    </div>
    <div id=tc></div>
</div>
<div id=h class=hid>
    <h1>pomodoro</h1>
    <p>enter time as MM:SS; type to add tasks</p>
    <p>made w &lt;3 by <a target="_blank" href="https://www.github.com/agilfor">agilfor</a></p>
</div>
<style>
    * {
        font-family: 'Courier New', Courier, monospace;
        color: #DFD0B8;
        text-align: center;
    }

    html {
        overflow: hidden;
    }

    body, #m, #c-ctnr {
        display: flex;
        justify-content: center;
    }    

    body {
        margin: 0;
        background: #393E46;
    }

    #m {
        flex-direction: column;
        height: 100vh;
    }

    #c-ctnr,
    #tc,
    #h {
        width: 30vw;
        min-width: 450px;
    }

    #c-ctnr,
    #h,
    .k {
        background: #222831;
        border: 2px solid #948979;
        border-radius: 20px;
    }

    #c-ctnr {
        flex-direction: column;
        height: max-content;
        margin: 10px 0;

        #c {
            align-self: center;
            width: 100%;
            background: none;
            border: 0;
            margin: 20px 20px 0;
            padding: 10px 10px;
            font-size: 120px;
            outline: 0;
            font-weight: bold;
        }

        #o {
            align-self: center;
            margin: 0 0 20px 0;
            padding: 10px 40px;
            border-radius: 10px;
            font-size: 20px;
        }
    }

    #tc {
        overflow-y: scroll;

        .k {
            margin: 10px 0;

            p {
                width: 100%;
                margin: 0;
                padding: 5px 0 0 0;
            }

            input {
                outline: 0;
                padding: 10px;
                background: none;
                border: 0;
                width: 100%;
                font-size: 15px;
                width: calc(100% - 20px);
            }
        }
    }

    button {
        background: none;
        border: solid 2px #DFD0B8;
        font-weight: bold;
    }

    button:hover {
        background: #DFD0B8;
        color: #222831;
        cursor: pointer;
    }

    button:active {
        background: #948979;
        border: #948979;
    }

    #t-h {
        position: fixed;
        top: 10px;
        right: 10px;
        border-radius: 5px;
    }

    #h {
        position: fixed;
        top: 0;
        align-content: center;
        margin: 10px;
        padding: 10px;
        transition: top 0.5s ease;
        box-shadow: 0 0 20px 10px #393E46;

        h1 {
            margin: 0;
            font-size: 30px;
        }

        a {
            color: #948979;
            text-decoration: none;
        }
    }

    .hid {
        top: -200px !important;
    }
</style>
<script>
    const d = document,
        h = d.getElementById("h").classList,
        c = d.getElementById("c"),
        btn = d.getElementById("o"),
        tmp = d.getElementById("tmp"),
        x = d.getElementById("tc"),
        cl = clearInterval,
        pi = parseInt;
    let s, clk;
    d.getElementById("t-h").onclick = () => h.toggle("hid");
    const pt = () => {
            const a = c.value.split(":");
            if (a.length != 2) {
                return alert("Enter time as MM:SS");
            }
            return 60 * pi(a[0]) + pi(a[1]);
        },
        strt = () => {
            s = pt();
            if (!s) { return; }
            btn.innerHTML = "PAUSE";
            btn.onclick = p;
            clk = setInterval(() => {
                s--;
                let a = Math.floor(s / 60), b = s - a * 60;
                c.value = `${String(a).padStart(2, "0")}:${String(b).padStart(2, "0")}`;
                if (s == 0) {
                    cl(clk);
                }
            }, 1000);
        },
        p = () => {
            cl(clk);
            btn.innerHTML = "START";
            btn.onclick = strt;
        },
        nt = () => {
            let a = tmp.content.cloneNode(true), b = a.querySelector(".k"), n = x.childElementCount + 1;
            b.querySelector(".ht").innerHTML = `Task #${n}`;
            b.id = `t-${n}`;
            x.appendChild(a);
        };
    btn.onclick = strt;
    c.onfocus = p;
    nt();
    d.onclick = (e) => {
        let t = e.target.closest(".k");
        if(!t) {
            let a = [...x.children];
            a.forEach((t, i) => {
                if (!t.querySelector(".d").value && i < a.length - 1) t.remove();
            })
            a = [...x.children];
            a.forEach((t, i) => {
                t.id = `t-${i + 1}`;
                t.querySelector(".ht").innerHTML = `Task #${i + 1}`;
            })
            if (a.length < 5 && a.every(t => t.querySelector(".d").value)) nt();
        }
        if (!e.target.closest("#h") && !h.contains("hid") && !e.target.closest("#t-h")) {
            h.add("hid");
        }
    };
</script>
