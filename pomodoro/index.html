<!DOCTYPE html>
<html>
    <head>
        <meta name=viewport content="width=device-width, initial-scale=1">
        <title>Pomodoro</title>
    </head>
    <body>
        <template id=tmp>
            <div class=task>
                <p class=ht></p>
                <input class=d placeholder="What are you working on?">
            </div>
        </template>
        <button id=t-h onclick="th()">?</button>
        <div id=m>
            <div id=c-ctnr>
                <input id=c value="30:00" placeholder="MM:SS">
                <button id=o onclick="strt()">START</button>
            </div>
            <div id=tc></div>
        </div>
        <div id=h class=hid>
            <h1>pomodoro</h1>
            <p>enter time in a MM:SS; type l in directly</p>
            <p>made w &lt;3 by <a target="_blank" href="https://www.github.com/agilfor">agilfor</a></p>
        </div>

        <style>
            * {
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #DFD0B8;
            }
            html { overflow: hidden; }

            @media screen and (max-width: 500px) {
                #tc, #c-ctnr {
                    width: 85vw !important;
                }
                #c {
                    font-size: 90px !important;
                }
                #o {
                    font-size: 15px !important;
                }
            }

            body {
                display: flex;
                margin: 0;
                padding: 0;
                justify-content: center;
                width: 100vw;
                height: 100vh;
                background: #393E46;
            }

            #m {
                display: flex;
                flex-direction: column;
                justify-content: center;
                width: fit-content;
                height: 100vh;
                align-self: center;
            }

            #c-ctnr {
                display: flex;
                flex-direction: column;
                width: 30vw;
                min-width: 450px;
                height: max-content;
                text-align: center;
                background: #222831;
                border-radius: 20px;
                border: 2px solid #948979;
                margin: 20px 0;
                #c {
                    text-align: center;
                    align-self: center;
                    width: 100%;
                    background: none;
                    border: none;
                    margin: 20px 20px 0 20px;
                    padding: 10px 10px 30px 10px;
                    font-size: 120px;
                    outline: none;
                    font-weight: bold;
                }
                #o {
                    align-self: center;
                    margin: 0 0 20px 0;
                    padding: 10px 40px;
                    border-radius: 10px;
                    font-size: 20px;
                }
            }

            #tc {
                width: 30vw;
                min-width: 450px;
                overflow-y: scroll;
                box-shadow: inset 0 0 5px 2px #393E46;
                .task {
                    border: solid 2px #948979;
                    border-radius: 10px;
                    background: #222831;
                    margin: 0 0 10px;
                    p {
                        width: 100%;
                        text-align: center;
                        margin: 0;
                        padding: 5px 0 0 0;
                    }
                    input {
                        text-align: center;
                        outline: none;
                        padding: 10px;
                        background: none;
                        border: none;
                        width: 100%;
                        font-size: 15px;
                        width: calc(100% - 20px);
                    }
                }
                .empty {
                    opacity: 0.75;
                }
            }

            button {
                background: transparent;
                border: solid 2px #DFD0B8;
                font-weight: bold;
            }

            button:hover {
                background: #DFD0B8;
                color: #222831;
                cursor: pointer;
            }
            button:active {
                background: #948979;
                border: #948979;
            }

            #t-h {
                position: fixed;
                top: 10px; right: 10px;
                border-radius: 5px;
            }
            
            #h {
                position: fixed;
                top: 0;
                text-align: center;
                align-content: center;
                width: 30vw;
                min-width: 450px;
                background: #222831;
                border: 2px solid #948979;
                border-radius: 20px;
                margin: 10px;
                transition: top 0.5s ease;
                box-shadow: 0 0 20px 10px #393E46;
                h1 {
                    padding: 10px 0 0 0;
                    margin: 0;
                    font-size: 30px;
                }
                p { padding: 0 20px; }
                a { color: #948979;}
                a:hover { color: #DFD0B8; }
            }
            .hid {
                top: -200px !important;
            }
        </style>
        <script>
            const d = document,
                h = d.getElementById("h"),
                th = () => h.classList.toggle("hid"),
                c = d.getElementById("c"),
                btn = d.getElementById("o"),
                tmp = d.getElementById("tmp"),
                x = d.getElementById("tc");
            let s, clk;
            const convert = (n) => {
                n = String(n);
                if (n.length == 1) { n = "0" + n; }
                return n;
            },
            pt = () => {
                const time = c.value.split(":");
                if (time.length != 2) {
                    alert("Please enter a time in MM:SS format!");
                    return -1;
                }
                return 60 * parseInt(time[0]) + parseInt(time[1]);
            },
            strt = () => {
                s = pt();
                if (s <= 0) { return; }
                btn.innerHTML = "PAUSE";
                btn.onclick = p;
                clk = setInterval(() => {
                    s--;
                    let a = Math.floor(s/60), b = s - a * 60;
                    c.value = `${convert(a)}:${convert(b)}`;
                    if (s == 0) {
                        clearInterval(clk);
                    }
                }, 1000);
            },
            p = () => {
                clearInterval(clk);
                btn.innerHTML = "START";
                btn.onclick = strt;
            },
            nt = () => {
                let a = tmp.content.cloneNode(true), b = a.querySelector("div.task"), n = x.childElementCount+1;
                b.querySelector("p.ht").innerHTML = `Task #${n}`;
                b.classList.add("empty");
                b.id = `tsk-${n}`;
                x.appendChild(a);
            };
            c.onfocus = p;
            nt();
            d.addEventListener("click", (e) => {
                let t = e.target.closest(".task");
                if (t) t.classList.remove("empty");
                else {
                    let a=[...x.children];
                    a.forEach((t, i) => {
                        if (!t.querySelector(".d").value && i<a.length-1) t.remove();
                    })
                    a=[...x.children];
                    a.forEach((t, i)=> {
                        t.id=`tsk-${i+1}`;
                        t.querySelector(".ht").innerHTML = `Task #${i+1}`;
                    })
                    if (a.length<5 && a.every(t=>t.querySelector(".d").value))nt();
                }
                if (!e.target.closest("#h") && !h.classList.contains("hid") && !e.target.closest("#t-h")) {
                    h.classList.add("hid");
                }
            });
        </script>
    </body>
</html>
