<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pomodoro</title>
    </head>
    <body>
        <template id="tsk-tmplt">
            <div class="task">
                <p class="tsk-title"></p>
                <input class="tsk-todo" name="txt" type="text" placeholder="What are you working on?">
            </div>
        </template>
        <button type="button" id="toggle-help" onclick="toggle_help()">?</button>
        <div id="content">
            <div id="countdown-ctnr">
                <input type="text" id="countdown" value="30:00" placeholder="MM:SS"></input>
                <button id="toggle" type="button" onclick="start_counting()">START</button>
            </div>
            <div id="tsks-ctnr"></div>
        </div>
        <div id="help" class="hidden">
            <h1>Pomodoro 101</h1>
            <p>Set the timer value by clicking on the timer and entering the time in a MM:SS format. Add up to five tasks by simply clicking and writing</p>
            <p>Thanks for using this lil' pomodoro by <a target="_blank" href="https://www.github.com/agilfor">agilfor</a>!</p>
        </div>

        <style>
            * {
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            html { overflow: hidden; }

            @media screen and (max-width: 500px) {
                #tsks-ctnr {
                    width: 85vw !important;
                }
                #countdown-ctnr {
                    width: 85vw !important;
                    #countdown {
                        font-size: 90px !important;
                    }
                    #toggle {
                        font-size: 15px !important;
                    }
                }
            }

            body {
                display: flex;
                margin: 0;
                padding: 0;
                justify-content: center;
                flex-direction: row;
                width: 100vw;
                height: 100vh;
                background-color: #393E46;
            }

            #content {
                display: flex;
                flex-direction: column;
                justify-content: center;
                width: fit-content;
                height: 100vh;
                align-self: center;
            }

            #countdown-ctnr {
                display: flex;
                flex-direction: column;
                color: #DFD0B8;
                width: 30vw;
                min-width: 450px;
                height: max-content;
                text-align: center;
                background-color: #222831;
                border-radius: 20px;
                border: 2px solid #948979;
                margin: 20px 0;
                transition: all ease 0.2s;
                #countdown {
                    text-align: center;
                    align-self: center;
                    width: 100%;
                    background: none;
                    border: none;
                    margin: 20px 20px 0 20px;
                    padding: 10px 10px 30px 10px;
                    font-size: 120px;
                    outline: none;
                    color: #DFD0B8;
                    font-weight: bold;
                }
                #toggle {
                    align-self: center;
                    width: fit-content;
                    background-color: transparent;
                    border: solid 2px #DFD0B8;
                    color: #DFD0B8;
                    font-weight: bold;
                    margin: 0 0 20px 0;
                    border-radius: 10px;
                    padding: 10px 40px;
                    font-size: 20px;
                }
                #toggle:hover {
                    background-color: #DFD0B8;
                    color: #222831;
                    cursor: pointer;
                }
                #toggle:active {
                    background-color: #948979;
                    border-color: #948979;
                }
            }

            #tsks-ctnr {
                width: 30vw;
                min-width: 450px;
                overflow-y: scroll;
                box-shadow: inset 0 0 5px 2px #393E46;
                .task {
                    border: solid 2px #948979;
                    border-radius: 10px;
                    background: #222831;
                    color: #DFD0B8;
                    margin: 0 0 10px;
                    p {
                        width: 100%;
                        text-align: center;
                        margin: 0;
                        padding: 5px 0 0 0;
                    }
                    input {
                        text-align: center;
                        outline: none;
                        padding: 10px;
                        background: none;
                        border: none;
                        width: 100%;
                        color: inherit;
                        font-size: 15px;
                        width: calc(100% - 20px);
                    }
                }
                .empty {
                    opacity: 0.75;
                }
            }

            #toggle-help {
                position: fixed;
                top: 10px; right: 10px;
                background-color: transparent;
                border: solid 2px #DFD0B8;
                border-radius: 5px;
                color: #DFD0B8;
                font-weight: bold;
            }
            #toggle-help:hover {
                background-color: #DFD0B8;
                color: #222831;
                cursor: pointer;
            }
            #toggle-help:active {
                background-color: #948979;
                border-color: #948979;
            }
            
            #help {
                opacity: 0.95;
                position: fixed;
                top: 10px;
                text-align: center;
                align-content: center;
                align-items: center;
                color: #DFD0B8;
                height: min-content;
                width: 30vw;
                min-width: 450px;
                background: #222831;
                border: 2px solid #948979;
                border-radius: 20px;
                margin: 10px;
                transition: top 0.5s ease;
                box-shadow: 0 0 20px 10px #393E46;
                h1 {
                    padding: 10px 0 0 0;
                    margin: 0;
                    font-size: 30px;
                }
                p {
                    padding: 0 20px;
                }
                a {
                    color: #948979;
                }
                a:hover {
                    color: #DFD0B8;
                }
            }
            .hidden {
                position: fixed;
                top: -200px !important;
            }
        </style>
        <script>
            const help = document.getElementById("help");
            const toggle_help = () => {
                if (help.classList.contains("hidden")) {
                    help.classList.remove("hidden");
                } else {
                    help.classList.add("hidden");
                }
            }
            // let notifs = false;
            // if (Notification.permission != "granted") {
            //     alert("Please allow notifications for when the timer is done :)");
            //     Notification.requestPermission().then((res) => {
            //         if (res == "granted") { notifs = true; }
            //     })
            // }
            const countdown = document.getElementById("countdown");
            const btn = document.getElementById("toggle");
            let remaining = null; // seconds
            let interval = null;
            function convert(n) {
                n = String(n);
                if (n.length == 1) { n = "0" + n; }
                return n;
            }
            const parse_time = () => {
                const time = countdown.value.split(":");
                if (time.length != 2) {
                    alert("Please enter a time in MM:SS format!");
                    return -1;
                }
                return 60 * parseInt(time[0]) + parseInt(time[1]);
            }
            const start_counting = () => {
                remaining = parse_time();
                if (remaining <= 0) { return; }
                btn.innerHTML = "PAUSE";
                btn.onclick = pause;
                interval = setInterval(() => {
                    remaining--;
                    let mins = Math.floor(remaining/60);
                    let secs = remaining - mins * 60;
                    countdown.value = `${convert(mins)}:${convert(secs)}`;
                    if (remaining == 0) {
                        // if (notifs) {
                        //     let n = new Notification("Pomodoro", {body: "Ding ding ding! Time's up!"});
                        //     setTimeout(n.close(), 2000);
                        // }
                        clearInterval(interval);
                    }
                }, 1000);
            };
            const pause = () => {
                clearInterval(interval);
                btn.innerHTML = "START";
                btn.onclick = start_counting;
            }
            countdown.onfocus = pause;

            const task_tmplt = document.getElementById("tsk-tmplt");
            const tasks_ctnr = document.getElementById("tsks-ctnr");
            let tasks = [];
            const focused_task = (i) => {
                const tsk = document.getElementById(`tsk-${i}`);
                tsk.classList.remove("empty");
            };
            const new_task = () => {
                let new_tsk = task_tmplt.content.cloneNode(true);
                const tsk = new_tsk.querySelector("div.task");
                const tsk_num = tasks.length + 1;
                tsk.querySelector("p.tsk-title").innerHTML = `Task #${tsk_num}`;
                tsk.classList.add("empty");
                tsk.id = `tsk-${tsk_num}`;
                tasks_ctnr.appendChild(new_tsk);
                tasks.push("");
                tsk.onclick = () => focused_task(tsk_num);
            };
            const update_tasks = () => {
                const tsks = tasks_ctnr.querySelectorAll(".tsk-todo");
                for (let i = 0; i < tsks.length; i++) {
                    tasks[i] = tsks[i].value;
                }
            };
            const regenerate_tasks_list = () => {
                while (tasks.includes("")) {
                    const i = tasks.indexOf("");
                    tasks.splice(i, 1);
                    tasks_ctnr.removeChild(tasks_ctnr.children[i]);
                }
                const tsks = tasks_ctnr.querySelectorAll(".task");
                for (let i = 0; i < tsks.length; i++) {
                    tsks[i].querySelector("p.tsk-title").innerHTML = `Task #${i+1}`;
                    tsks[i].id = `tsk-${i+1}`;
                    tsks[i].onclick = () => focused_task(i+1);
                }
            };
            new_task();
            document.addEventListener("click", (event) => {
                if (!event.target.closest(".task")) {
                    update_tasks();
                    const tsks = document.querySelectorAll(".task");
                    let need_regen = false;
                    for (let i = 0; i < tsks.length; i++) {
                        const input = tsks[i].querySelector(".tsk-todo");
                        if (input.value === "" && i == (tsks.length - 1)) tsks[i].classList.add("empty");
                        else if (input.value === "") need_regen = true;
                        else tasks[i] = input.value;
                    }
                    if (need_regen) regenerate_tasks_list();
                    if (!tasks.includes("") && tasks.length < 5) new_task();
                }
                if (!event.target.closest("#help") && !help.classList.contains("hidden") && !event.target.closest("#toggle-help")) {
                    help.classList.add("hidden");
                }
            });
        </script>
    </body>
</html>
